<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptCoach - Generador de Guiones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .input-section {
            margin-bottom: 40px;
        }

        .input-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .message-input {
            width: 100%;
            min-height: 150px;
            padding: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .example-text {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 20px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 40px;
        }

        .result-tabs {
            display: flex;
            border-bottom: 2px solid #e1e5e9;
            margin-bottom: 20px;
        }

        .tab {
            padding: 15px 25px;
            background: #f8f9fa;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .whatsapp-summary {
            background: #25d366;
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .json-output {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            overflow-x: auto;
        }

        .json-output pre {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .success {
            background: #51cf66;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #5a6fd8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .result-tabs {
                flex-direction: column;
            }
            
            .tab {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 ScriptCoach</h1>
            <p>Asistente experto en crear guiones listos para grabar</p>
        </div>

        <div class="content">
            <div class="input-section">
                <h2>📱 Mensaje de WhatsApp</h2>
                <textarea 
                    id="messageInput" 
                    class="message-input" 
                    placeholder="Pega aquí el mensaje de WhatsApp que incluye email y brief..."
                ></textarea>
                
                <div class="example-text">
                    <strong>Ejemplo:</strong><br>
                    "Hola! Mi email es usuario@ejemplo.com. Necesito un guión sobre marketing digital para TikTok, 60 segundos, tono amigable. Quiero generar leads."
                </div>

                <button id="generateBtn" class="generate-btn">🚀 Generar Guión</button>
            </div>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Generando tu guión con IA...</p>
            </div>

            <div id="results" class="results">
                <div class="result-tabs">
                    <button class="tab active" onclick="showTab('whatsapp')">📱 Resumen WhatsApp</button>
                    <button class="tab" onclick="showTab('json')">📄 JSON Completo</button>
                </div>

                <div id="whatsapp-tab" class="tab-content active">
                    <div id="whatsappSummary" class="whatsapp-summary"></div>
                    <button class="copy-btn" onclick="copyToClipboard('whatsappSummary')">📋 Copiar</button>
                </div>

                <div id="json-tab" class="tab-content">
                    <div id="jsonOutput" class="json-output">
                        <pre id="jsonContent"></pre>
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard('jsonContent')">📋 Copiar JSON</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const whatsappSummary = document.getElementById('whatsappSummary');
        const jsonContent = document.getElementById('jsonContent');

        generateBtn.addEventListener('click', async () => {
            const message = messageInput.value.trim();
            
            if (!message) {
                alert('Por favor ingresa un mensaje');
                return;
            }

            // Mostrar loading
            generateBtn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';

            try {
                const response = await fetch('/api/process-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.whatsapp_resumen);
                } else {
                    showResults(data);
                }

            } catch (error) {
                showError('Error de conexión. Intenta de nuevo.');
            } finally {
                generateBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function showResults(data) {
            whatsappSummary.textContent = data.whatsapp_resumen;
            jsonContent.textContent = JSON.stringify(data.json_entregable, null, 2);
            results.style.display = 'block';
        }

        function showError(message) {
            whatsappSummary.innerHTML = `<div class="error">❌ ${message}</div>`;
            results.style.display = 'block';
        }

        function showTab(tabName) {
            // Ocultar todas las tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Mostrar la tab seleccionada
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent || element.innerText;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ Copiado!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Permitir Enter para generar
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                generateBtn.click();
            }
        });
    </script>
</body>
</html>
